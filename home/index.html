<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常用工具类</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 15% -10%, #e8f0ff 0%, transparent 60%),
        radial-gradient(800px 480px at 95% 0%, #eafaf4 0%, transparent 55%),
        #f5f7fa;
      padding: 56px 20px 72px;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ===== 头部 ===== */
    header {
      text-align: center;
      margin-bottom: 44px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111827;
      margin-bottom: 10px;
    }

    h1 .brand {
      background: linear-gradient(100deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      font-size: 14px;
      color: #8b95a7;
      letter-spacing: 0.3px;
    }

    /* ===== 工具网格 ===== */
    .tool-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .tool-card {
      --accent: #3b82f6;
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      background: #ffffff;
      border: 1px solid #e8ecf3;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      transition: transform 0.22s cubic-bezier(.2,.8,.3,1),
                  box-shadow 0.22s ease,
                  border-color 0.22s ease;
      opacity: 0;
      animation: rise 0.45s cubic-bezier(.2,.8,.3,1) forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 错峰入场 */
    .tool-card:nth-child(1) { animation-delay: .02s; }
    .tool-card:nth-child(2) { animation-delay: .06s; }
    .tool-card:nth-child(3) { animation-delay: .10s; }
    .tool-card:nth-child(4) { animation-delay: .14s; }
    .tool-card:nth-child(5) { animation-delay: .18s; }
    .tool-card:nth-child(6) { animation-delay: .22s; }
    .tool-card:nth-child(7) { animation-delay: .26s; }
    .tool-card:nth-child(8) { animation-delay: .30s; }

    /* 左侧色条 */
    .tool-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.25s ease;
      border-radius: 0 3px 3px 0;
    }

    .tool-card:hover::before,
    .tool-card:focus-visible::before {
      transform: scaleY(1);
    }

    .tool-card:hover,
    .tool-card:focus-visible {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--accent) 40%, #e8ecf3);
      box-shadow: 0 12px 28px -10px color-mix(in srgb, var(--accent) 45%, transparent),
                  0 2px 6px rgba(16, 24, 40, 0.05);
      outline: none;
    }

    .tool-card:active {
      transform: translateY(-1px);
    }

    /* ===== 图标 ===== */
    .icon {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      font-size: 22px;
      line-height: 1;
      border-radius: 13px;
      background: color-mix(in srgb, var(--accent) 12%, #ffffff);
      transition: transform 0.25s cubic-bezier(.2,.8,.3,1);
    }

    .tool-card:hover .icon {
      transform: scale(1.08) rotate(-4deg);
    }

    /* ===== 文字 ===== */
    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      font-size: 12.5px;
      color: #97a1b3;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== 箭头 ===== */
    .arrow {
      flex: 0 0 auto;
      font-size: 18px;
      color: #cbd3e1;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .tool-card:hover .arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* ===== 页脚 ===== */
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12.5px;
      color: #aab3c2;
      letter-spacing: 0.3px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      body { padding: 40px 16px 56px; }
      h1 { font-size: 24px; }
      header { margin-bottom: 32px; }
      .tool-list { grid-template-columns: 1fr; gap: 12px; }
      .tool-card { padding: 16px 18px; gap: 14px; }
      .icon { width: 42px; height: 42px; font-size: 20px; border-radius: 12px; }
      .name { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .tool-card { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>

</body>
</html>
