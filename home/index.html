<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="常用工具集合：多语言管理、文本编辑、纸牌、俄罗斯方块、老虎机、五子棋、图片浏览、小说阅读、网速测试等">
  <title>常用工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 15% -10%, #e8f0ff 0%, transparent 60%),
        radial-gradient(800px 480px at 95% 0%, #eafaf4 0%, transparent 55%),
        #f5f7fa;
      padding: 56px 20px 72px;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ===== 头部 ===== */
    header {
      text-align: center;
      margin-bottom: 44px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111827;
      margin-bottom: 10px;
    }

    h1 .brand {
      background: linear-gradient(100deg, #3b82f6, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      font-size: 14px;
      color: #8b95a7;
      letter-spacing: 0.3px;
    }

    /* ===== 工具网格 ===== */
    .tool-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .tool-card {
      --accent: #3b82f6;
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      background: #ffffff;
      border: 1px solid #e8ecf3;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      transition: transform 0.22s cubic-bezier(.2,.8,.3,1),
                  box-shadow 0.22s ease,
                  border-color 0.22s ease;
      opacity: 0;
      animation: rise 0.45s cubic-bezier(.2,.8,.3,1) forwards;
      /* 由 JS 注入 --i（序号）实现错峰入场，不再硬编码 nth-child */
      animation-delay: calc(var(--i, 0) * 40ms);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* 左侧色条 */
    .tool-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.25s ease;
      border-radius: 0 3px 3px 0;
    }

    .tool-card:hover::before,
    .tool-card:focus-visible::before {
      transform: scaleY(1);
    }

    .tool-card:hover,
    .tool-card:focus-visible {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--accent) 40%, #e8ecf3);
      box-shadow: 0 12px 28px -10px color-mix(in srgb, var(--accent) 45%, transparent),
                  0 2px 6px rgba(16, 24, 40, 0.05);
      outline: none;
    }

    .tool-card:active {
      transform: translateY(-1px);
    }

    /* ===== 图标 ===== */
    .icon {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      font-size: 22px;
      line-height: 1;
      border-radius: 13px;
      background: color-mix(in srgb, var(--accent) 12%, #ffffff);
      transition: transform 0.25s cubic-bezier(.2,.8,.3,1);
    }

    .tool-card:hover .icon,
    .tool-card:focus-visible .icon {
      transform: scale(1.08) rotate(-4deg);
    }

    /* ===== 文字 ===== */
    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .desc {
      font-size: 12.5px;
      color: #97a1b3;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== 箭头 ===== */
    .arrow {
      flex: 0 0 auto;
      font-size: 18px;
      color: #cbd3e1;
      transition: transform 0.25s ease, color 0.25s ease;
    }

    .tool-card:hover .arrow,
    .tool-card:focus-visible .arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* ===== 页脚 ===== */
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12.5px;
      color: #aab3c2;
      letter-spacing: 0.3px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      body { padding: 40px 16px 56px; }
      h1 { font-size: 24px; }
      header { margin-bottom: 32px; }
      .tool-list { grid-template-columns: 1fr; gap: 12px; }
      .tool-card { padding: 16px 18px; gap: 14px; }
      .icon { width: 42px; height: 42px; font-size: 20px; border-radius: 12px; }
      .name { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .tool-card { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>常用<span class="brand">工具</span></h1>
    <p>精选实用小工具，点击卡片即可使用</p>
  </header>

  <div class="tool-list" id="toolList"></div>

  <footer id="footer"></footer>
</div>

<noscript>
  <p style="text-align:center;color:#8b95a7;font-size:13px;">
    当前浏览器未启用 JavaScript，工具列表无法显示。
  </p>
</noscript>

<script>
(function () {
  'use strict';

  // 站点根路径：本地工具只需配置 path，外部链接配置 href
  const BASE = 'https://songzhiyin.github.io/commonUtil/';

  const TOOLS = [
    { name: 'APP多语言管理', desc: '集中管理多语言文案',   icon: '🌐', accent: '#3b82f6', path: 'appLanguage/' },
    { name: '文本编辑器',   desc: '在线编辑与处理文本',   icon: '📝', accent: '#8b5cf6', path: 'textEditor/' },
    { name: '经典纸牌',     desc: '经典纸牌，挑战手气',   icon: '🃏', accent: '#f59e0b', path: 'gameCard/' },
    { name: '俄罗斯方块',   desc: '休闲益智小游戏',       icon: '🎮', accent: '#ef4444', path: 'gameRussia/' },
    { name: '发牌工具',     desc: '发牌工具，喝酒专用',   icon: '🎰', accent: '#d946ef', path: 'gameTiger/' },
    { name: '五子棋',       desc: '人机 / 双人对弈',      icon: '⚫', accent: '#0ea5e9', path: 'gameGomoku/' },
    { name: '图片浏览器',   desc: '快速浏览本地图片',     icon: '🖼️', accent: '#06b6d4', path: 'picture/' },
    { name: '小说阅读器',   desc: '沉浸式在线阅读',       icon: '📖', accent: '#10b981', path: 'novel/' },
    { name: '网速测试',     desc: '测下载 / 上传 / 带宽', icon: '⚡', accent: '#6366f1', path: 'speedTestUtil/' },
    { name: 'QQ邮箱',       desc: '登录网页版邮箱',       icon: '✉️', accent: '#ec4899', href: 'https://mail.qq.com/', external: true }
  ];

  const listEl = document.getElementById('toolList');
  const footerEl = document.getElementById('footer');

  // 用 DOM API 构建，避免 innerHTML 带来的转义/注入问题
  function createCard(tool, index) {
    const card = document.createElement('a');
    card.className = 'tool-card';
    card.href = tool.href || BASE + tool.path;
    card.style.setProperty('--accent', tool.accent);
    card.style.setProperty('--i', index);

    if (tool.external) {
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    }

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = tool.icon;

    const info = document.createElement('span');
    info.className = 'info';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = tool.name;

    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = tool.desc;

    info.append(name, desc);

    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '›';

    card.append(icon, info, arrow);
    return card;
  }

  // 一次性插入，减少重排
  const fragment = document.createDocumentFragment();
  TOOLS.forEach((tool, i) => fragment.appendChild(createCard(tool, i)));
  listEl.appendChild(fragment);

  // 页脚数量自动同步，新增工具无需手动改文案
  footerEl.textContent = `共 ${TOOLS.length} 个工具 · 点击卡片直接打开`;
})();
</script>

</body>
</html>
