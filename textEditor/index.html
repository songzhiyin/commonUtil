<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>纯文本编辑器 · 预览 / 编辑 / 原样导出</title>
  <script>
    /* 手动主题：仅 light / dark，不跟随系统 */
    (function () {
      var pref = 'light';
      try {
        var v = localStorage.getItem('pte.theme');
        if (v === 'light' || v === 'dark') pref = v;
      } catch (e) {}
      var root = document.documentElement;
      root.setAttribute('data-theme', pref);
      root.setAttribute('data-theme-pref', pref);
    })();
  </script>
  <style>
    /* =========================================================
     * 主题变量
     * ======================================================= */
    :root {
      --r-lg: 12px;
      --r-md: 9px;
      --r-sm: 7px;
      --pad-x: 26px;
      --pad-b: 48px;
      --sbw: 0px;              /* 由 JS 测量写入：垂直滚动条宽度 */
    }

    /* ---------- 浅色（默认） ---------- */
    :root,
    :root[data-theme="light"] {
      color-scheme: light;

      --bg: #ffffff;
      --surface: #f6f8fa;
      --surface-2: #ffffff;
      --surface-3: #eef1f5;
      --border: #e4e8ee;
      --border-2: #d3d9e0;
      --border-hover: #bfc7d2;

      --text: #1c2331;
      --text-2: #57606e;
      --text-3: #8792a2;

      --accent: #2563eb;
      --accent-hi: #3b82f6;
      --accent-soft: rgba(37, 99, 235, .10);

      --green: #1a7f37;
      --yellow: #9a6700;
      --red: #cf222e;

      --sel-bg: rgba(37, 99, 235, .22);

      --scroll-thumb: #cdd4dd;
      --scroll-thumb-hover: #b3bcc8;

      --brand-bg-a: #dbeafe;
      --brand-bg-b: #eff6ff;
      --brand-border: #c7ddfd;
      --brand-fg: #2563eb;

      --empty-glow: rgba(37, 99, 235, .09);
      --empty-icon-bg-a: #ffffff;
      --empty-icon-bg-b: #f4f7fb;
      --empty-icon-fg: #9fb0c9;
      --empty-icon-shadow: rgba(28, 35, 49, .07);

      --overlay-bg: rgba(240, 245, 252, .74);
      --card-shadow: 0 22px 60px rgba(28, 35, 49, .16);
      --toast-shadow: 0 12px 34px rgba(28, 35, 49, .16);
      --drop-border: rgba(37, 99, 235, .5);

      --primary-a: #3b82f6;
      --primary-b: #2563eb;
      --primary-bd: #2563eb;
      --primary-hover-a: #4b8ef7;
      --primary-hover-b: #2f74ee;
      --primary-hover-bd: #2f74ee;
      --primary-shadow: 0 1px 2px rgba(37, 99, 235, .22);
      --primary-shadow-hover: 0 2px 9px rgba(37, 99, 235, .28);

      --badge-utf-fg: #1d4ed8;  --badge-utf-bg: #eef4ff;  --badge-utf-bd: #c9dbfb;
      --badge-ansi-fg: #7c3aed; --badge-ansi-bg: #f6f2ff; --badge-ansi-bd: #ddd2fb;
      --badge-warn-fg: #9a6700; --badge-warn-bg: #fff9ea; --badge-warn-bd: #f0e0b8;

      --toast-ok-bd: #b9e6c9;
      --toast-warn-bd: #f0e0b8;
      --toast-err-bd: #f3c3c1;

      --select-arrow: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M3 4.6 6 7.6 9 4.6' fill='none' stroke='%2357606e' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");

      --tok-comment: #6e7781;
      --tok-keyword: #cf222e;
      --tok-string:  #0a3069;
      --tok-number:  #0550ae;
      --tok-literal: #0550ae;
      --tok-func:    #8250df;
      --tok-tag:     #116329;
      --tok-punct:   #57606e;
    }

    /* ---------- 深色 ---------- */
    :root[data-theme="dark"] {
      color-scheme: dark;

      --bg: #0d1117;
      --surface: #12161e;
      --surface-2: #181d27;
      --surface-3: #232a37;
      --border: #242c39;
      --border-2: #333d4d;
      --border-hover: #46536a;

      --text: #d7dee8;
      --text-2: #98a3b3;
      --text-3: #6f7a8b;

      --accent: #5b9dff;
      --accent-hi: #7fb2ff;
      --accent-soft: rgba(91, 157, 255, .14);

      --green: #4ec97a;
      --yellow: #e0b341;
      --red: #f2706f;

      --sel-bg: rgba(88, 166, 255, .30);

      --scroll-thumb: #333d4d;
      --scroll-thumb-hover: #46536a;

      --brand-bg-a: rgba(91, 157, 255, .22);
      --brand-bg-b: rgba(91, 157, 255, .06);
      --brand-border: rgba(91, 157, 255, .32);
      --brand-fg: #7fb2ff;

      --empty-glow: rgba(91, 157, 255, .10);
      --empty-icon-bg-a: #1a2029;
      --empty-icon-bg-b: #12161e;
      --empty-icon-fg: #6a7484;
      --empty-icon-shadow: rgba(0, 0, 0, .35);

      --overlay-bg: rgba(8, 11, 17, .68);
      --card-shadow: 0 22px 60px rgba(0, 0, 0, .55);
      --toast-shadow: 0 14px 40px rgba(0, 0, 0, .5);
      --drop-border: rgba(91, 157, 255, .55);

      --primary-a: #4b8ef7;
      --primary-b: #2f74ee;
      --primary-bd: #2f74ee;
      --primary-hover-a: #5c9bfa;
      --primary-hover-b: #3d80f2;
      --primary-hover-bd: #3d80f2;
      --primary-shadow: 0 1px 2px rgba(0, 0, 0, .35);
      --primary-shadow-hover: 0 3px 14px rgba(59, 125, 230, .40);

      --badge-utf-fg: #7fb2ff;  --badge-utf-bg: rgba(91, 157, 255, .12);  --badge-utf-bd: rgba(91, 157, 255, .32);
      --badge-ansi-fg: #c39bff; --badge-ansi-bg: rgba(163, 113, 247, .12); --badge-ansi-bd: rgba(163, 113, 247, .32);
      --badge-warn-fg: #e0b341; --badge-warn-bg: rgba(224, 179, 65, .12); --badge-warn-bd: rgba(224, 179, 65, .32);

      --toast-ok-bd: rgba(78, 201, 122, .40);
      --toast-warn-bd: rgba(224, 179, 65, .40);
      --toast-err-bd: rgba(242, 112, 111, .40);

      --select-arrow: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M3 4.6 6 7.6 9 4.6' fill='none' stroke='%2398a3b3' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");

      --tok-comment: #8b949e;
      --tok-keyword: #ff7b72;
      --tok-string:  #a5d6ff;
      --tok-number:  #79c0ff;
      --tok-literal: #79c0ff;
      --tok-func:    #d2a8ff;
      --tok-tag:     #7ee787;
      --tok-punct:   #8b949e;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color .18s ease, color .18s ease;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- 顶部工具栏 ---------- */
    .toolbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      margin-right: 4px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: var(--r-md);
      background: linear-gradient(160deg, var(--brand-bg-a), var(--brand-bg-b));
      border: 1px solid var(--brand-border);
      color: var(--brand-fg);
    }
    .brand-mark svg { width: 16px; height: 16px; }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .brand-text b {
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: .3px;
      color: var(--text);
    }
    .brand-text small {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-3);
      letter-spacing: .1px;
    }

    .spacer { flex: 1 1 auto; }

    .btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 34px;
      padding: 0 13px;
      border-radius: var(--r-md);
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background .16s, border-color .16s, color .16s,
                  box-shadow .16s, transform .08s;
    }
    .btn svg {
      width: 15px;
      height: 15px;
      flex: none;
      opacity: .8;
    }
    .btn:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--border-hover);
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn:disabled {
      opacity: .38;
      cursor: not-allowed;
    }

    .btn.primary {
      background: linear-gradient(180deg, var(--primary-a), var(--primary-b));
      border-color: var(--primary-bd);
      color: #fff;
      font-weight: 600;
      box-shadow: var(--primary-shadow);
    }
    .btn.primary svg { opacity: 1; }
    .btn.primary:hover:not(:disabled) {
      background: linear-gradient(180deg, var(--primary-hover-a), var(--primary-hover-b));
      border-color: var(--primary-hover-bd);
      box-shadow: var(--primary-shadow-hover);
    }

    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-2);
    }
    .btn.ghost:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--border);
      color: var(--text);
    }

    /* 主题切换按钮（仅 light / dark） */
    .btn.icon-only {
      width: 34px;
      padding: 0;
    }
    .btn.icon-only svg { width: 17px; height: 17px; opacity: .9; }

    #btnTheme svg { display: none; }
    :root[data-theme-pref="light"] #btnTheme .ico-light { display: block; }
    :root[data-theme-pref="dark"]  #btnTheme .ico-dark  { display: block; }

    /* ---------- 选项条 ---------- */
    .options-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 9px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-2);
    }

    .opt {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .opt > span {
      font-size: 11.5px;
      color: var(--text-3);
      letter-spacing: .2px;
    }

    .opt select {
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--surface-2);
      background-image: var(--select-arrow);
      background-repeat: no-repeat;
      background-position: right 9px center;
      background-size: 12px;
      color: var(--text);
      border: 1px solid var(--border-2);
      border-radius: var(--r-sm);
      padding: 5px 28px 5px 10px;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      max-width: 210px;
      transition: border-color .15s, background-color .15s, box-shadow .15s;
    }
    .opt select:hover:not(:disabled) { border-color: var(--border-hover); }
    .opt select:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .opt select:disabled { opacity: .4; cursor: not-allowed; }

    .opt-hint {
      font-size: 11.5px;
      color: var(--text-3);
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    /* ---------- 编辑区（高亮层 + 透明 textarea） ---------- */
    .main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .editor-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 共用排版参数：两层必须完全一致 */
    #editor,
    #hl {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 22px var(--pad-x) var(--pad-b);
      border: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
                   "Liberation Mono", "Courier New", monospace;
      font-size: 13.5px;
      line-height: 1.78;
      tab-size: 4;
      -moz-tab-size: 4;
      letter-spacing: normal;
      word-spacing: normal;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      text-align: left;
      direction: ltr;
    }

    /* 高亮层在下 */
    #hl {
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      color: var(--text);
      background: var(--bg);
      contain: content;                 /* 限制重绘范围，明显降低长文本卡顿 */
      /* 关键：右侧多留出滚动条宽度，保证与 textarea 换行位置一致 */
      padding-right: calc(var(--pad-x) + var(--sbw));
    }
    #hl code {
      display: block;
      font: inherit;
      white-space: inherit;
      word-break: inherit;
      overflow-wrap: inherit;
    }

    /* 输入层在上：文字透明，只保留光标和选区 */
    #editor {
      z-index: 2;
      resize: none;
      outline: 0;
      overflow: auto;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: var(--accent);
      scrollbar-width: thin;
      scrollbar-color: var(--scroll-thumb) transparent;
    }

    /* 半透明选区，让下层高亮文字透出来 */
    #editor::selection {
      background: var(--sel-bg);
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    #editor::-moz-selection {
      background: var(--sel-bg);
      color: transparent;
    }

    #editor::-webkit-scrollbar { width: 12px; height: 12px; }
    #editor::-webkit-scrollbar-track { background: transparent; }
    #editor::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 10px;
      border: 3px solid var(--bg);
      background-clip: padding-box;
    }
    #editor::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-thumb-hover);
      background-clip: padding-box;
    }

    /* ---------- 语法着色 ---------- */
    .tok-comment { color: var(--tok-comment); font-style: italic; }
    .tok-keyword { color: var(--tok-keyword); }
    .tok-string  { color: var(--tok-string); }
    .tok-number  { color: var(--tok-number); }
    .tok-literal { color: var(--tok-literal); }
    .tok-func    { color: var(--tok-func); }
    .tok-tag     { color: var(--tok-tag); font-weight: 600; }
    .tok-punct   { color: var(--tok-punct); }

    /* ---------- 空状态 ---------- */
    .empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      text-align: center;
      padding: 24px;
      color: var(--text-3);
      pointer-events: none;
      overflow: hidden;
      background: var(--bg);
    }
    .empty::before {
      content: "";
      position: absolute;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--empty-glow), transparent 68%);
    }
    .empty .icon {
      position: relative;
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(180deg, var(--empty-icon-bg-a), var(--empty-icon-bg-b));
      border: 1px solid var(--border);
      color: var(--empty-icon-fg);
      box-shadow: 0 10px 28px var(--empty-icon-shadow);
      margin-bottom: 2px;
    }
    .empty .icon svg { width: 32px; height: 32px; }
    .empty .title {
      position: relative;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .2px;
    }
    .empty .sub {
      position: relative;
      font-size: 12.5px;
      line-height: 1.85;
    }

    /* ---------- 状态栏 ---------- */
    .statusbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-3);
      overflow: hidden;
      white-space: nowrap;
    }
    .statusbar .grow { flex: 1 1 auto; }
    .statusbar .sep {
      font-size: 0;
      display: inline-block;
      flex: none;
      width: 1px;
      height: 11px;
      background: var(--border-2);
    }
    .statusbar #stFile {
      max-width: 38vw;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-2);
    }

    .badge {
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .2px;
      color: var(--text-2);
    }
    .badge.utf {
      color: var(--badge-utf-fg);
      border-color: var(--badge-utf-bd);
      background: var(--badge-utf-bg);
    }
    .badge.ansi {
      color: var(--badge-ansi-fg);
      border-color: var(--badge-ansi-bd);
      background: var(--badge-ansi-bg);
    }
    .badge.warn {
      color: var(--badge-warn-fg);
      border-color: var(--badge-warn-bd);
      background: var(--badge-warn-bg);
    }

    #stDirty {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-3);
      transition: color .16s;
    }
    #stDirty::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .4;
      transition: opacity .16s, box-shadow .16s;
    }
    #stDirty.is-dirty {
      color: var(--yellow);
      font-weight: 600;
    }
    #stDirty.is-dirty::before {
      opacity: 1;
      box-shadow: 0 0 0 3px rgba(154, 103, 0, .14);
    }

    /* ---------- 拖拽层 ---------- */
    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--overlay-bg);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
    }
    .drop-overlay.show { opacity: 1; }

    .drop-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 34px 46px;
      border-radius: 16px;
      border: 1.5px dashed var(--drop-border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
      box-shadow: var(--card-shadow);
      transform: scale(.97);
      transition: transform .18s ease;
    }
    .drop-overlay.show .drop-card { transform: scale(1); }
    .drop-card svg { width: 30px; height: 30px; color: var(--accent); }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 46px;
      z-index: 60;
      transform: translate(-50%, 14px);
      max-width: min(80vw, 560px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px 11px 16px;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      box-shadow: var(--toast-shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast::before {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.ok    { border-color: var(--toast-ok-bd); }
    .toast.warn  { border-color: var(--toast-warn-bd); }
    .toast.error { border-color: var(--toast-err-bd); }
    .toast.ok::before    { background: var(--green);  box-shadow: 0 0 0 3px rgba(26, 127, 55, .13); }
    .toast.warn::before  { background: var(--yellow); box-shadow: 0 0 0 3px rgba(154, 103, 0, .13); }
    .toast.error::before { background: var(--red);    box-shadow: 0 0 0 3px rgba(207, 34, 46, .13); }

    /* ---------- 响应式 ---------- */
    @media (max-width: 900px) {
      :root { --pad-x: 16px; --pad-b: 40px; }
      .brand-text small { display: none; }
      .btn { height: 32px; padding: 0 10px; font-size: 12.5px; gap: 5px; }
      .btn svg { width: 14px; height: 14px; }
      .btn.icon-only { width: 32px; }
      .btn.icon-only svg { width: 16px; height: 16px; }
      .options-bar { gap: 12px; padding: 8px 12px; }
      .opt select { max-width: 132px; padding: 4px 26px 4px 9px; }
      .opt-hint { display: none; }
      .statusbar { gap: 8px; font-size: 11px; padding: 6px 12px; }
      .statusbar #stFile { max-width: 28vw; }
    }
    @media (max-width: 620px) {
      .brand-text { display: none; }
      .btn { padding: 0 8px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ======= 工具栏 ======= -->
  <header class="toolbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.5 2.5H6A1.5 1.5 0 0 0 4.5 4v12A1.5 1.5 0 0 0 6 17.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5z"/>
          <path d="M11.5 2.5v4h4"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>纯文本编辑器</b>
        <small>预览 · 编辑 · 保持原编码导出</small>
      </span>
    </div>

    <div class="spacer"></div>

    <button id="btnNew" class="btn" title="Ctrl+N">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5h7A1.5 1.5 0 0 0 13 13V5"/>
        <path d="M9.5 1.5V4a1 1 0 0 0 1 1H13"/>
        <path d="M8 8.5v4M6 10.5h4"/>
      </svg>
      新建
    </button>

    <button id="btnOpen" class="btn" title="Ctrl+O">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.9 12.1V3.9a1 1 0 0 1 1-1h3.1l1.5 1.8h5.6a1 1 0 0 1 1 1v6.4a1 1 0 0 1-1 1H2.9a1 1 0 0 1-1-1Z"/>
      </svg>
      打开
    </button>
    <input id="fileInput" type="file" hidden />

    <button id="btnSave" class="btn primary" disabled title="Ctrl+S">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 4A1.5 1.5 0 0 1 4 2.5h5.6L13.5 6.4V12A1.5 1.5 0 0 1 12 13.5H4A1.5 1.5 0 0 1 2.5 12z"/>
        <path d="M5 2.5v4h5v-4"/>
        <path d="M4.6 13.5v-4h6.8v4"/>
      </svg>
      保存
    </button>

    <button id="btnSaveAs" class="btn" disabled title="Ctrl+Shift+S：文件名 = 原名 + 月日时分">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/>
        <path d="M10.5 2.5H4A1.5 1.5 0 0 0 2.5 4v7"/>

    </button>

    <button id="btnRevert" class="btn ghost" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">

      还原
    </button>

    <button id="btnTheme" class="btn icon-only" title="主题：浅色" aria-label="切换主题">
      <svg class="ico-light" viewBox="0 0 20 20" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round">
        <circle cx="10" cy="10" r="3.6"/>
        <path d="M10 1.8v2.2M10 16v2.2M18.2 10H16M4 10H1.8
                 M15.8 4.2l-1.6 1.6M5.8 14.2l-1.6 1.6
                 M15.8 15.8l-1.6-1.6M5.8 5.8 4.2 4.2"/>

      <svg class="ico-dark" viewBox="0 0 20 20" fill="none" stroke="currentColor"

  </header>

  <!-- ======= 选项条 ======= -->
  <div class="options-bar">
    <label class="opt">
      <span>读取编码</span>

    <label class="opt">

    <label class="opt">
      <span>语法</span>

        <option value="plain">纯文本</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="markup">HTML / XML</option>
        <option value="css">CSS</option>
        <option value="json">JSON</option>
        <option value="clike">C / Java / Go / Rust…</option>
        <option value="shell">Shell</option>

  <!-- ======= 主体 ======= -->
  <main class="main">
    <div class="empty" id="emptyState">
      <div class="icon" aria-hidden="true">

             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/>
          <path d="M9 13h6M9 17h4"/>
        </svg>
      </div>
      <div class="title">拖入任意文件，或点击「打开」/「新建」</div>
      <div class="sub">
        不限制文件类型，一律按纯文本处理<br />
        自动识别 UTF-8 / UTF-16 / GB18030 等编码，编辑后按原编码写回
      </div>
    </div>

    <div class="editor-wrap" id="editorWrap" hidden>
      <pre id="hl" aria-hidden="true"><code id="hlCode"></code></pre>
      <textarea id="editor" spellcheck="false" autocomplete="off"

  <!-- ======= 状态栏 ======= -->
  <footer class="statusbar">
    <span id="stFile">未打开文件</span>

<div class="drop-overlay" id="dropOverlay">

      <path d="M7.5 8.5 12 4l4.5 4.5"/>
      <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
    </svg>
    <span>松开鼠标以打开文件</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    'use strict';

    /* =========================================================
     * 元素
     * ======================================================= */
    const $ = function (id) { return document.getElementById(id); };

    const editor      = $('editor');
    const editorWrap  = $('editorWrap');
    const hl          = $('hl');
    const hlCode      = $('hlCode');
    const emptyState  = $('emptyState');
    const btnNew      = $('btnNew');
    const btnOpen     = $('btnOpen');
    const btnSave     = $('btnSave');
    const btnSaveAs   = $('btnSaveAs');
    const btnRevert   = $('btnRevert');
    const btnTheme    = $('btnTheme');
    const fileInput   = $('fileInput');
    const selDecode   = $('selDecode');
    const selEncode   = $('selEncode');
    const selEol      = $('selEol');
    const selLang     = $('selLang');
    const optHint     = $('optHint');
    const stFile      = $('stFile');
    const stEncoding  = $('stEncoding');
    const stEol       = $('stEol');
    const stLang      = $('stLang');
    const stSize      = $('stSize');
    const stDirty     = $('stDirty');
    const dropOverlay = $('dropOverlay');
    const toastEl     = $('toast');

    /* =========================================================
     * 主题管理（手动 light / dark，不跟随系统）
     * ======================================================= */
    const THEME_KEY = 'pte.theme';

    let themePref = 'light';
    try {
      const v = localStorage.getItem(THEME_KEY);
      if (v === 'light' || v === 'dark') themePref = v;
    } catch (e) {}

    function themeLabel(p) { return p === 'dark' ? '深色' : '浅色'; }

    function applyTheme() {
      const root = document.documentElement;
      root.setAttribute('data-theme', themePref);
      root.setAttribute('data-theme-pref', themePref);
      btnTheme.title = '主题：' + themeLabel(themePref) + '（点击切换）';
      btnTheme.setAttribute('aria-label',
        '切换到' + (themePref === 'dark' ? '浅色' : '深色') + '主题');
    }

    btnTheme.addEventListener('click', function () {
      themePref = (themePref === 'dark') ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, themePref); } catch (e) {}
      applyTheme();
      toast('主题：' + themeLabel(themePref), 'ok');
    });

    /* =========================================================
     * 编码表
     * ======================================================= */
    const ENCODINGS = [
      { id: 'utf-8',        label: 'UTF-8' },
      { id: 'utf-8-bom',    label: 'UTF-8 (BOM)' },
      { id: 'utf-16le',     label: 'UTF-16 LE' },
      { id: 'utf-16le-bom', label: 'UTF-16 LE (BOM)' },
      { id: 'utf-16be',     label: 'UTF-16 BE' },
      { id: 'utf-16be-bom', label: 'UTF-16 BE (BOM)' },
      { id: 'gb18030',      label: 'GB18030 / GBK' },
      { id: 'big5',         label: 'Big5（繁体）' },
      { id: 'shift_jis',    label: 'Shift_JIS（日文）' },
      { id: 'euc-kr',       label: 'EUC-KR（韩文）' },
      { id: 'windows-1252', label: 'Windows-1252（西欧）' }
    ];

    const ENC_LABEL = {};
    const ENC_BASE = {
      'utf-8': 'utf-8',           'utf-8-bom': 'utf-8',
      'utf-16le': 'utf-16le',     'utf-16le-bom': 'utf-16le',
      'utf-16be': 'utf-16be',     'utf-16be-bom': 'utf-16be',
      'gb18030': 'gb18030',
      'big5': 'big5',
      'shift_jis': 'shift_jis',
      'euc-kr': 'euc-kr',
      'windows-1252': 'windows-1252'
    };
    ENCODINGS.forEach(function (e) { ENC_LABEL[e.id] = e.label; });

    function canEncode(enc) {
      return enc === 'utf-8' || enc === 'utf-8-bom' ||
             enc === 'utf-16le' || enc === 'utf-16le-bom' ||
             enc === 'utf-16be' || enc === 'utf-16be-bom';
    }

    function encodingLabel(id) { return ENC_LABEL[id] || id; }

    /* =========================================================
     * 语法定义
     * ======================================================= */
    const LANG_DEFS = {
      javascript: {
        name: 'JavaScript',
        lineComments: ['//'],
        blockComments: [['/*', '*/']],
        strings: ['"', "'", '`'],
        keywords: 'break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new return super switch this throw try typeof var void while with yield async await of static get set from as',
        literals: 'true false null undefined NaN Infinity this super'
      },
      typescript: {
        name: 'TypeScript',
        lineComments: ['//'],
        blockComments: [['/*', '*/']],
        strings: ['"', "'", '`'],
        keywords: 'break case catch class const continue declare default delete do else enum export extends finally for function if implements import in instanceof interface let new private protected public readonly return static super switch this throw try type typeof var void while with yield async await of as namespace abstract keyof infer is satisfies',
        literals: 'true false null undefined NaN Infinity never unknown any'
      },
      python: {
        name: 'Python',
        lineComments: ['#'],
        blockComments: [],
        strings: ['"', "'"],
        keywords: 'and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case print len range',
        literals: 'True False None self cls'
      },
      css: {
        name: 'CSS',
        lineComments: [],
        blockComments: [['/*', '*/']],
        strings: ['"', "'"],
        keywords: 'important media supports keyframes import charset font-face page layer container',
        literals: ''
      },
      json: {
        name: 'JSON',
        lineComments: ['//'],
        blockComments: [['/*', '*/']],
        strings: ['"'],
        keywords: '',
        literals: 'true false null'
      },
      clike: {
        name: 'C / Java / Go…',
        lineComments: ['//'],
        blockComments: [['/*', '*/']],
        strings: ['"', "'"],
        keywords: 'abstract assert auto boolean break byte case catch char class const constexpr continue default defer delete do double else enum extends extern final finally float for friend func go goto if implements import in instanceof int interface let long map namespace new package private protected pub public range register return select short signed sizeof static struct super switch synchronized template this throw throws trait transient try typedef typename type union unsafe unsigned use using var virtual void volatile where while yield async await fn impl match mod mut override println package printf scanf',
        literals: 'true false null nullptr NULL undefined NaN'
      },
      shell: {
        name: 'Shell',
        lineComments: ['#'],
        blockComments: [],
        strings: ['"', "'"],
        keywords: 'if then else elif fi for while until do done case esac function return in export local readonly source alias unset shift trap set exit break continue echo printf cd pwd read test',
        literals: 'true false'
      },
      sql: {
        name: 'SQL',
        ci: true,
        lineComments: ['--'],
        blockComments: [['/*', '*/']],
        strings: ["'", '"'],
        keywords: 'select from where insert into values update set delete create alter drop table view index join inner left right full outer cross on group by order having limit offset union all as and or not is in between like exists distinct count sum avg min max primary key foreign references default constraint unique check cascade begin commit rollback transaction if else end case when then',
        literals: 'null true false'
      }
    };

    const LANG_NAMES = {
      javascript: 'JavaScript', typescript: 'TypeScript', python: 'Python',
      markup: 'HTML/XML', css: 'CSS', json: 'JSON', clike: 'C/Java',
      shell: 'Shell', sql: 'SQL', plain: '纯文本'
    };

    const EXT_LANG = {
      js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript',
      ts: 'typescript', tsx: 'typescript', mts: 'typescript', cts: 'typescript',
      py: 'python', pyw: 'python', pyi: 'python',
      html: 'markup', htm: 'markup', xml: 'markup', svg: 'markup',
      vue: 'markup', xhtml: 'markup', svelte: 'markup',
      css: 'css', scss: 'css', sass: 'css', less: 'css', styl: 'css',
      json: 'json', jsonc: 'json', json5: 'json',
      java: 'clike', kt: 'clike', kts: 'clike', scala: 'clike',
      groovy: 'clike', c: 'clike', h: 'clike', cpp: 'clike', cc: 'clike',
      cxx: 'clike', hpp: 'clike', hh: 'clike', cs: 'clike', go: 'clike',
      rs: 'clike', swift: 'clike', m: 'clike', mm: 'clike', php: 'clike',
      sh: 'shell', bash: 'shell', zsh: 'shell', fish: 'shell', ksh: 'shell',
      sql: 'sql'
    };

    /* =========================================================
     * 语法高亮引擎（优化版）
     * ======================================================= */
    const RE_IDENT = /[A-Za-z_$\u00c0-\uffff][\w$\u00c0-\uffff]*/y;
    const RE_NUM   = /0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?\d+)?/y;

    /* 高亮阈值：超过则退化为纯文本显示，避免卡顿 */
    const HL_LIMIT      = 120000;   // 字符数上限
    const HL_HTML_LIMIT = 900000;   // 生成 HTML 长度上限

    /* 预编译语言定义（Set 只构建一次，而不是每次高亮都构建） */
    function compileLangDef(def) {
      if (!def || def.__c) return def ? def.__c : null;
      const ci = !!def.ci;
      const kwRaw   = (def.keywords || '').split(/\s+/).filter(Boolean);
      const litRaw  = (def.literals || '').split(/\s+/).filter(Boolean);
      const kw  = new Set(ci ? kwRaw.map(function (s) { return s.toLowerCase(); }) : kwRaw);
      const lit = new Set(ci ? litRaw.map(function (s) { return s.toLowerCase(); }) : litRaw);
      def.__c = {
        ci: ci,
        kw: kw,
        lit: lit,
        lineComments: def.lineComments || [],
        blockComments: def.blockComments || [],
        stringSet: new Set(def.strings || [])
      };
      return def.__c;
    }
    Object.keys(LANG_DEFS).forEach(function (k) { compileLangDef(LANG_DEFS[k]); });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return c === '&' ? '&amp;'
             : c === '<' ? '&lt;'
             : c === '>' ? '&gt;'
             : '&quot;';
      });
    }

    function span(cls, text) {
      return '<span class="tok-' + cls + '">' + escapeHtml(text) + '</span>';
    }

    function isIdentStart(ch) {
      const c = ch.charCodeAt(0);
      return (c >= 97 && c <= 122) || (c >= 65 && c <= 90) ||
             c === 95 || c === 36 || c > 127;
    }

    const SP_COMMENT_OPEN = '<span class="tok-comment">';
    const SP_STRING_OPEN  = '<span class="tok-string">';
    const SP_NUMBER_OPEN  = '<span class="tok-number">';
    const SP_KEY_OPEN     = '<span class="tok-keyword">';
    const SP_LIT_OPEN     = '<span class="tok-literal">';
    const SP_FUNC_OPEN    = '<span class="tok-func">';
    const SP_CLOSE        = '</span>';

    /* 通用高亮：用数组收集片段，最后 join，减少字符串拼接开销 */
    function highlightCode(code, langKey) {
      if (langKey === 'markup') return highlightMarkup(code);

      const def = LANG_DEFS[langKey];
      if (!def) return escapeHtml(code);
      const c = def.__c || compileLangDef(def);

      const lineComments  = c.lineComments;
      const blockComments = c.blockComments;
      const stringSet     = c.stringSet;
      const kw            = c.kw;
      const lit           = c.lit;
      const ci            = c.ci;

      const out = [];
      let i = 0;
      const n = code.length;

      while (i < n) {
        let handled = false;

        /* 块注释 */
        for (let k = 0; k < blockComments.length; k++) {
          const open = blockComments[k][0];
          if (code.startsWith(open, i)) {
            const close = blockComments[k][1];
            const e = code.indexOf(close, i + open.length);
            const stop = e === -1 ? n : e + close.length;
            out.push(SP_COMMENT_OPEN, escapeHtml(code.slice(i, stop)), SP_CLOSE);
            i = stop; handled = true; break;
          }
        }
        if (handled) continue;

        /* 行注释 */
        for (let k = 0; k < lineComments.length; k++) {
          const open = lineComments[k];
          if (code.startsWith(open, i)) {
            let e = code.indexOf('\n', i);
            if (e === -1) e = n;
            out.push(SP_COMMENT_OPEN, escapeHtml(code.slice(i, e)), SP_CLOSE);
            i = e; handled = true; break;
          }
        }
        if (handled) continue;

        const ch = code[i];

        /* 字符串 */
        if (stringSet.has(ch)) {
          let j = i + 1;
          while (j < n) {
            const cj = code[j];
            if (cj === '\\') { j += 2; continue; }
            if (cj === ch) { j++; break; }
            if (ch !== '`' && cj === '\n') break;
            j++;
          }
          out.push(SP_STRING_OPEN, escapeHtml(code.slice(i, j)), SP_CLOSE);
          i = j; continue;
        }

        /* 数字 */
        if (ch >= '0' && ch <= '9') {
          const prev = i > 0 ? code[i - 1] : '';
          if (!/[A-Za-z0-9_$]/.test(prev)) {
            RE_NUM.lastIndex = i;
            const m = RE_NUM.exec(code);
            if (m) {
              out.push(SP_NUMBER_OPEN, m[0], SP_CLOSE);
              i = RE_NUM.lastIndex;
              continue;
            }
          }
        }

        /* 标识符 / 关键字 */
        if (isIdentStart(ch)) {
          RE_IDENT.lastIndex = i;
          const m = RE_IDENT.exec(code);
          if (m) {
            const word = m[0];
            i = RE_IDENT.lastIndex;
            const key = ci ? word.toLowerCase() : word;
            if (kw.has(key))          out.push(SP_KEY_OPEN, word, SP_CLOSE);
            else if (lit.has(key))    out.push(SP_LIT_OPEN, word, SP_CLOSE);
            else if (code[i] === '(') out.push(SP_FUNC_OPEN, word, SP_CLOSE);
            else                      out.push(word);
            continue;
          }
        }

        /* 普通字符：仅对可能产生 HTML 冲突的字符做转义 */
        const cc = code.charCodeAt(i);
        if (cc === 38 || cc === 60 || cc === 62 || cc === 34) {
          out.push(escapeHtml(ch));
        } else {
          out.push(ch);
        }
        i++;
      }
      return out.join('');
    }

    const RE_MARKUP = /<!--[\s\S]*?(?:-->|$)|<!\[CDATA\[[\s\S]*?(?:\]\]>|$)|<!DOCTYPE[^>]*>|<\?[\s\S]*?(?:\?>|$)|<\/?([A-Za-z][\w:.\-]*)|(\/?>)|("[^"\n]*"|'[^'\n]*')|(&[a-zA-Z#][\w]*;)/g;

    function highlightMarkup(code) {
      const out = [];
      let last = 0;
      let m;
      RE_MARKUP.lastIndex = 0;

      while ((m = RE_MARKUP.exec(code))) {
        if (m.index > last) out.push(escapeHtml(code.slice(last, m.index)));
        const t = m[0];

        if (t.charCodeAt(0) === 60 && (t.charAt(1) === '!' || t.charAt(1) === '?')) {
          out.push(span('comment', t));
        } else if (m[2]) {
          out.push(span('punct', t));
        } else if (m[3]) {
          out.push(span('string', t));
        } else if (m[4]) {
          out.push(span('number', t));
        } else if (m[1]) {
          const nameStart = t.length - m[1].length;
          out.push(span('punct', t.slice(0, nameStart)), span('tag', m[1]));
        } else {
          out.push(escapeHtml(t));
        }
        last = m.index + t.length;
      }
      if (last < code.length) out.push(escapeHtml(code.slice(last)));
      return out.join('');
    }

    /* =========================================================
     * 语言自动识别
     * ======================================================= */
    function guessByContent(text) {
      const s = text.slice(0, 4000);
      if (!s.trim()) return null;

      if (/<!DOCTYPE\s+html|<html[\s>]|<\?xml[\s>]/i.test(s)) return 'markup';
      if (/^\s*[{[][\s\S]*[}\]]\s*$/.test(s.trim()) && /"[^"\n]*"\s*:/.test(s)) return 'json';
      if (/^\s*#!\/.*\b(bash|sh|zsh|fish)\b/m.test(s)) return 'shell';
      if (/\bdef\s+\w+\s*\(|\bclass\s+\w+\s*[(:]|^\s*(import\s+\w+\s*$|from\s+\w+\s+import)\b/m.test(s)) return 'python';
      if (/^\s*(package\s+\w+;|public\s+(class|static)|#include\s*<|\bint\s+main\s*\()/m.test(s)) return 'clike';
      if (/\bfunction\b|\b(const|let|var)\s+\w+\s*=|=>|console\.log|^\s*import\s+.*\bfrom\b/m.test(s)) return 'javascript';
      if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE\s+TABLE)\b/im.test(s)) return 'sql';
      if (/[.#][\w-]+\s*\{[^}]*:[^}]*\}/.test(s)) return 'css';

      return null;
    }

    function detectLang(fileName, text) {
      const m = /\.([A-Za-z0-9]+)$/.exec(fileName || '');
      if (m) {
        const ext = m[1].toLowerCase();
        if (EXT_LANG[ext] !== undefined) return EXT_LANG[ext];
        if (ext === 'txt' || ext === 'log' || ext === 'md' || ext === 'csv') return 'plain';
      }
      return guessByContent(text);
    }

    /* =========================================================
     * 全局状态
     * ======================================================= */
    const state = {
      handle:    null,
      fileName:  '',
      rawBytes:  null,
      encoding:  'utf-8',
      eol:       '\n',
      savedText: '',
      loaded:    false,
      isNew:     false,
      dirty:     false,
      lang:      'auto',
      resolvedLang: null
    };

    /* =========================================================
     * 编解码
     * ======================================================= */
    function decodeWith(bytes, encodingId) {
      const base = ENC_BASE[encodingId] || 'utf-8';
      let dec;
      try { dec = new TextDecoder(base, { fatal: false }); }
      catch (err) { dec = new TextDecoder('utf-8', { fatal: false }); }
      return dec.decode(bytes);
    }

    function encodeWith(text, encodingId) {
      const withBom = /-bom$/.test(encodingId);
      const base = withBom ? encodingId.replace(/-bom$/, '') : encodingId;

      if (base === 'utf-8') {
        const bytes = new TextEncoder().encode(text);
        if (withBom) {
          const out = new Uint8Array(bytes.length + 3);
          out[0] = 0xEF; out[1] = 0xBB; out[2] = 0xBF;
          out.set(bytes, 3);
          return out;
        }
        return bytes;
      }

      if (base === 'utf-16le' || base === 'utf-16be') {
        const little = (base === 'utf-16le');
        const head = withBom ? 2 : 0;
        const out = new Uint8Array(head + text.length * 2);
        let o = 0;
        if (withBom) {
          out[o++] = little ? 0xFF : 0xFE;
          out[o++] = little ? 0xFE : 0xFF;
        }
        for (let i = 0; i < text.length; i++) {
          const c = text.charCodeAt(i);
          if (little) { out[o++] = c & 0xFF; out[o++] = (c >> 8) & 0xFF; }
          else        { out[o++] = (c >> 8) & 0xFF; out[o++] = c & 0xFF; }
        }
        return out;
      }

      return null;
    }

    /* =========================================================
     * 编码探测
     * ======================================================= */
    function detectEncoding(bytes) {
      if (!bytes || bytes.length === 0) return 'utf-8';

      if (bytes.length >= 3 &&
          bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) return 'utf-8-bom';
      if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) return 'utf-16le-bom';
      if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) return 'utf-16be-bom';

      const n = Math.min(bytes.length, 1024);
      let evenZero = 0, oddZero = 0;
      for (let i = 0; i < n; i++) {
        if (bytes[i] === 0) { if (i % 2 === 0) evenZero++; else oddZero++; }
      }
      const half = Math.floor(n / 2);
      if (half >= 4) {
        if (oddZero  >= half * 0.7 && evenZero < half * 0.1) return 'utf-16le';
        if (evenZero >= half * 0.7 && oddZero  < half * 0.1) return 'utf-16be';
      }

      try {
        new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        return 'utf-8';
      } catch (err) { /* not utf-8 */ }

      return 'gb18030';
    }

    function detectEol(text) {
      const crlf = (text.match(/\r\n/g) || []).length;
      const lfAll = (text.match(/\n/g) || []).length;
      return (crlf > lfAll - crlf) ? '\r\n' : '\n';
    }

    function toLF(text) { return text.replace(/\r\n?/g, '\n'); }

    /* =========================================================
     * 文件名工具
     * ======================================================= */
    function buildNewName(name) {
      const d = new Date();
      const p = function (n) { return String(n).padStart(2, '0'); };
      const stamp = p(d.getMonth() + 1) + p(d.getDate()) +
                    p(d.getHours()) + p(d.getMinutes());
      const dot = name.lastIndexOf('.');
      if (dot > 0) return name.slice(0, dot) + stamp + name.slice(dot);
      return name + stamp;
    }

    /* =========================================================
     * 下拉框初始化
     * ======================================================= */
    function fillEncodingSelect(sel, withSame) {
      sel.innerHTML = '';
      if (withSame) {
        const o = document.createElement('option');
        o.value = '__same__';
        o.textContent = '跟随读取编码';
        sel.appendChild(o);
      }
      ENCODINGS.forEach(function (e) {
        const o = document.createElement('option');
        o.value = e.id;
        o.textContent = e.label;
        if (!canEncode(e.id)) o.title = '导出时会提示转为 UTF-8';
        sel.appendChild(o);
      });
    }

    /* =========================================================
     * 高亮渲染（带节流 + 大文本保护）
     * ======================================================= */
    const HL_INTERVAL = 80;    // ms
    let hlTimer = null;
    let hlLastRun = 0;

    let langCacheKey = '\u0000';
    let langCacheVal = null;

    function resolveLang() {
      if (state.lang !== 'auto') return state.lang;
      const text = editor.value;
      const head = text.length > 4000 ? text.slice(0, 4000) : text;
      const key = state.fileName + '\u0000' + head;
      if (key === langCacheKey) return langCacheVal;
      const val = detectLang(state.fileName, text);
      langCacheKey = key;
      langCacheVal = val;
      return val;
    }

    function refreshHighlight() {
      if (!state.loaded) return;

      const text = editor.value;
      const lang = resolveLang();
      state.resolvedLang = lang;

      const needHighlight = text.length <= HL_LIMIT &&
                            lang && lang !== 'plain' &&
                            (lang === 'markup' || LANG_DEFS[lang]);

      if (needHighlight) {
        const html = highlightCode(text, lang);
        if (html.length <= HL_HTML_LIMIT) {
          hlCode.innerHTML = html + '\n';
        } else {
          hlCode.textContent = text + '\n';
        }
      } else {
        hlCode.textContent = text + '\n';
      }

      syncGutter();
      syncScrollNow();
      updateStatus();
    }

    function scheduleHighlight() {
      if (hlTimer) return;
      const wait = Math.max(0, HL_INTERVAL - (performance.now() - hlLastRun));
      hlTimer = setTimeout(function () {
        hlTimer = null;
        hlLastRun = performance.now();
        refreshHighlight();
      }, wait);
    }

    /* 立即执行一次（用于打开/新建/切换语言等场景） */
    function flushHighlight() {
      if (hlTimer) { clearTimeout(hlTimer); hlTimer = null; }
      hlLastRun = performance.now();
      refreshHighlight();
    }

    /* ---------- 滚动同步 ---------- */
    let scrollRaf = 0;
    function syncScroll() {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(function () {
        scrollRaf = 0;
        hl.scrollTop = editor.scrollTop;
        hl.scrollLeft = editor.scrollLeft;
      });
    }
    function syncScrollNow() {
      hl.scrollTop = editor.scrollTop;
      hl.scrollLeft = editor.scrollLeft;
    }
    editor.addEventListener('scroll', syncScroll, { passive: true });

    /* ---------- 滚动条宽度对齐（避免换行错位） ---------- */
    let gutterW = -1;
    function syncGutter() {
      const w = Math.max(0,
        Math.round(editor.getBoundingClientRect().width - editor.clientWidth));
      if (w !== gutterW) {
        gutterW = w;
        document.documentElement.style.setProperty('--sbw', w + 'px');
      }
    }
    if (window.ResizeObserver) {
      try { new ResizeObserver(syncGutter).observe(editor); } catch (e) {}
    }
    window.addEventListener('resize', syncGutter, { passive: true });

    /* =========================================================
     * 打开 / 加载 / 新建
     * ======================================================= */
    async function openFile() {
      if (typeof window.showOpenFilePicker === 'function') {
        try {
          const handles = await window.showOpenFilePicker({ multiple: false });
          const handle = handles[0];
          const file = await handle.getFile();
          await loadFile(file, handle);
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.warn('showOpenFilePicker 失败，回退：', err);
        }
      }
      fileInput.click();
    }

    fileInput.addEventListener('change', async function () {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      await loadFile(file, null);
      fileInput.value = '';
    });

    async function loadFile(file, handle) {
      try {
        const buffer = await file.arrayBuffer();
        const bytes = new Uint8Array(buffer);

        if (bytes.length > 20 * 1024 * 1024) {
          toast('文件较大（' + (bytes.length / 1048576).toFixed(1) + ' MB），编辑可能卡顿', 'warn');
        }

        const enc = detectEncoding(bytes);
        const text = decodeWith(bytes, enc);
        const normalized = toLF(text);

        const badCount = (normalized.match(/\uFFFD/g) || []).length;
        const maybeBinary = normalized.length > 200 && badCount > normalized.length * 0.05;

        state.handle    = handle || null;
        state.fileName  = file.name;
        state.rawBytes  = bytes;
        state.encoding  = enc;
        state.eol       = detectEol(text);
        state.savedText = normalized;
        state.loaded    = true;
        state.isNew     = false;
        state.lang      = 'auto';
        langCacheKey    = '\u0000';
        langCacheVal    = null;

        editor.value = normalized;
        editor.scrollTop = 0;
        editor.scrollLeft = 0;

        emptyState.hidden = true;
        editorWrap.hidden = false;
        document.title = file.name + ' · 纯文本编辑器';

        setDirty(false);
        updateOptionsUI();
        flushHighlight();
        editor.focus();

        if (maybeBinary) {
          toast('警告：文件疑似二进制或编码识别有误，可手动切换「读取编码」', 'warn');
        } else {
          toast('已加载：' + file.name, 'ok');
        }
      } catch (err) {
        console.error(err);
        toast('读取失败：' + (err && err.message ? err.message : err), 'error');
      }
    }

    function newFile() {
      state.handle    = null;
      state.fileName  = '未命名.txt';
      state.rawBytes  = null;
      state.encoding  = 'utf-8';
      state.eol       = '\n';
      state.savedText = '';
      state.loaded    = true;
      state.isNew     = true;
      state.lang      = 'auto';
      langCacheKey    = '\u0000';
      langCacheVal    = null;

      editor.value = '';
      editor.scrollTop = 0;

      emptyState.hidden = true;
      editorWrap.hidden = false;
      document.title = '未命名.txt · 纯文本编辑器';

      setDirty(false);
      updateOptionsUI();
      flushHighlight();
      editor.focus();
      toast('已新建空白文件（导出为 .txt）', 'ok');
    }

    /* =========================================================
     * 导出
     * ======================================================= */
    function buildExportText() {
      let t = toLF(editor.value);
      if (state.eol === '\r\n') t = t.replace(/\n/g, '\r\n');
      return t;
    }

    function getExportEncoding() {
      const v = selEncode.value;
      if (!v || v === '__same__') return state.encoding;
      return v;
    }

    function resolveExportEncoding() {
      let enc = getExportEncoding();

      if (!canEncode(enc)) {
        const ok = window.confirm(
          '保存编码为「' + encodingLabel(enc) + '」，\n' +
          '浏览器无法直接写出该编码。\n\n' +
          '是否改用 UTF-8 保存？\n' +
          '· 文件内容不会乱码\n' +
          '· 但文件编码会变为 UTF-8\n\n' +
          '（如不想转换，请先在「保存编码」中选择 UTF-8 / UTF-16）'
        );
        if (!ok) return null;
        enc = 'utf-8';
        selEncode.value = 'utf-8';
      }
      return enc;
    }

    async function ensurePermission(handle, mode) {
      if (typeof handle.queryPermission !== 'function') return true;
      const opts = { mode: mode };
      try {
        if (await handle.queryPermission(opts) === 'granted') return true;
        if (await handle.requestPermission(opts) === 'granted') return true;
      } catch (err) { console.warn('权限检查失败：', err); }
      return false;
    }

    async function writeToHandle(handle, bytes) {
      const w = await handle.createWritable();
      try { await w.write(bytes); } finally { await w.close(); }
    }

    function downloadBytes(bytes, filename) {
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }

    async function saveOverwrite() {
      if (!state.loaded) return;

      const enc = resolveExportEncoding();
      if (!enc) return;

      const bytes = encodeWith(buildExportText(), enc);
      if (!bytes) { toast('无法以该编码保存', 'error'); return; }

      if (state.handle) {
        try {
          const ok = await ensurePermission(state.handle, 'readwrite');
          if (!ok) {
            toast('未获得写入权限，已改为下载副本', 'warn');
            downloadBytes(bytes, state.fileName);
          } else {
            await writeToHandle(state.handle, bytes);
            toast('已保存：' + state.fileName, 'ok');
          }
        } catch (err) {
          console.error(err);
          toast('保存失败：' + (err && err.message ? err.message : err), 'error');
          return;
        }
      } else {
        downloadBytes(bytes, state.fileName);
        toast('已下载：' + state.fileName, 'ok');
      }

      state.encoding  = enc;
      state.savedText = editor.value;
      state.rawBytes  = bytes;
      state.isNew     = false;
      setDirty(false);
      updateOptionsUI();
      updateStatus();
    }

    async function saveAsCopy() {
      if (!state.loaded) return;

      const enc = resolveExportEncoding();
      if (!enc) return;

      const bytes = encodeWith(buildExportText(), enc);
      if (!bytes) { toast('无法以该编码保存', 'error'); return; }

      const newName = buildNewName(state.fileName);

      if (typeof window.showSaveFilePicker === 'function') {
        try {
          const handle = await window.showSaveFilePicker({ suggestedName: newName });
          await writeToHandle(handle, bytes);
          toast('已另存为：' + handle.name, 'ok');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          console.warn('showSaveFilePicker 失败，回退下载：', err);
        }
      }

      downloadBytes(bytes, newName);
      toast('已下载新文件：' + newName, 'ok');
    }

    /* =========================================================
     * UI 状态
     * ======================================================= */
    function updateOptionsUI() {
      const on = state.loaded;

      selEol.disabled    = !on;
      selEncode.disabled = !on;
      selLang.disabled   = !on;

      if (!on) {
        selDecode.disabled = true;
        return;
      }

      selDecode.disabled = state.isNew;
      if (!state.isNew && selDecode.value !== state.encoding) {
        selDecode.value = state.encoding;
      }
      selEol.value = (state.eol === '\r\n') ? 'crlf' : 'lf';
      selLang.value = state.lang;

      if (selEncode.value !== '__same__' &&
          !selEncode.querySelector('option[value="' + selEncode.value + '"]')) {
        selEncode.value = '__same__';
      }
    }

    function updateStatus() {
      if (!state.loaded) {
        stFile.textContent = '未打开文件';
        stEncoding.className = 'badge';
        stEncoding.textContent = '—';
        stEol.textContent = '—';
        stLang.className = 'badge';
        stLang.textContent = '—';
        stSize.textContent = '—';
        btnSave.disabled = true;
        btnSaveAs.disabled = true;
        btnRevert.disabled = true;
        optHint.textContent = '';
        return;
      }

      stFile.textContent = state.fileName +
        (state.isNew ? '（新建）' : (state.handle ? '' : '（只读模式）'));

      let cls, label;
      if (state.encoding === 'utf-8' || state.encoding === 'utf-8-bom') {
        cls = 'utf';
        label = state.encoding === 'utf-8-bom' ? 'UTF-8 BOM' : 'UTF-8';
      } else if (state.encoding.indexOf('utf-16') === 0) {
        cls = 'utf';
        label = state.encoding.toUpperCase().replace('-', ' ');
      } else {
        cls = 'ansi';
        label = encodingLabel(state.encoding);
      }
      stEncoding.className = 'badge ' + cls;
      stEncoding.textContent = label;

      stEol.textContent = '换行 ' + (state.eol === '\r\n' ? 'CRLF' : 'LF');

      const lang = state.resolvedLang;
      if (lang && lang !== 'plain') {
        stLang.className = 'badge utf';
        stLang.textContent = LANG_NAMES[lang] || lang;
      } else {
        stLang.className = 'badge';
        stLang.textContent = '纯文本';
      }

      stSize.textContent = editor.value.length + ' 字符';

      btnSave.disabled   = false;
      btnSaveAs.disabled = false;
      btnRevert.disabled = !state.dirty;

      const exEnc = getExportEncoding();
      if (canEncode(exEnc)) {
        optHint.textContent = '导出将以 ' + encodingLabel(exEnc) + ' 写出';
      } else {
        optHint.textContent = '⚠ ' + encodingLabel(exEnc) + ' 无法直接写出，导出前会询问是否转 UTF-8';
      }
    }

    function setDirty(isDirty) {
      if (state.dirty === isDirty) return;
      state.dirty = isDirty;
      stDirty.textContent = isDirty ? '已修改' : '未修改';
      stDirty.classList.toggle('is-dirty', isDirty);
      if (state.loaded) btnRevert.disabled = !isDirty;
    }

    let toastTimer = null;
    function toast(msg, type) {
      toastEl.textContent = msg;
      toastEl.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 3000);
    }

    /* =========================================================
     * 事件绑定
     * ======================================================= */
    btnNew.addEventListener('click', function () {
      if (state.dirty && !confirm('当前有未保存的修改，确定新建空白文件？')) return;
      newFile();
    });

    btnOpen.addEventListener('click', function () {
      if (state.dirty && !confirm('当前有未保存的修改，确定打开其他文件？')) return;
      openFile();
    });

    btnSave.addEventListener('click', saveOverwrite);
    btnSaveAs.addEventListener('click', saveAsCopy);

    btnRevert.addEventListener('click', function () {
      if (!state.loaded) return;
      if (state.dirty && !confirm('确定放弃未保存的修改，还原到上次保存的内容？')) return;
      editor.value = state.savedText;
      setDirty(false);
      flushHighlight();
      toast('已还原', 'ok');
    });

    editor.addEventListener('input', function () {
      const v = editor.value;
      setDirty(v !== state.savedText);
      stSize.textContent = v.length + ' 字符';
      scheduleHighlight();
    });

    /* Tab 缩进 */
    editor.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      e.preventDefault();
      const s = editor.selectionStart, t = editor.selectionEnd;
      const v = editor.value;
      editor.value = v.slice(0, s) + '\t' + v.slice(t);
      editor.selectionStart = editor.selectionEnd = s + 1;
      setDirty(editor.value !== state.savedText);
      stSize.textContent = editor.value.length + ' 字符';
      scheduleHighlight();
    });

    /* 读取编码切换 */
    selDecode.addEventListener('change', function () {
      if (!state.loaded || state.isNew || !state.rawBytes) return;

      const newEnc = selDecode.value;
      if (state.dirty &&
          !confirm('切换读取编码会重新解释原始字节，未保存的修改将丢失。\n是否继续？')) {
        selDecode.value = state.encoding;
        return;
      }

      const text = decodeWith(state.rawBytes, newEnc);
      const normalized = toLF(text);

      state.encoding  = newEnc;
      state.eol       = detectEol(text);
      state.savedText = normalized;
      langCacheKey    = '\u0000';
      langCacheVal    = null;

      editor.value = normalized;
      editor.scrollTop = 0;
      setDirty(false);
      updateOptionsUI();
      flushHighlight();

      const bad = (normalized.match(/\uFFFD/g) || []).length;
      if (bad > 0) toast('该编码下有 ' + bad + ' 个字符无法解码', 'warn');
      else toast('已按 ' + encodingLabel(newEnc) + ' 重新读取', 'ok');
    });

    /* 换行符切换 */
    selEol.addEventListener('change', function () {
      const newEol = (selEol.value === 'crlf') ? '\r\n' : '\n';
      if (state.eol === newEol) return;
      state.eol = newEol;
      setDirty(true);
      updateStatus();
    });

    /* 保存编码切换 */
    selEncode.addEventListener('change', updateStatus);

    /* 语法切换 */
    selLang.addEventListener('change', function () {
      state.lang = selLang.value;
      flushHighlight();
    });

    /* 快捷键 */
    document.addEventListener('keydown', function (e) {
      const mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === 's') {
        e.preventDefault();
        if (e.shiftKey) saveAsCopy();
        else saveOverwrite();
      } else if (k === 'o') {
        e.preventDefault();
        if (state.dirty && !confirm('当前有未保存的修改，确定打开其他文件？')) return;
        openFile();
      } else if (k === 'n') {
        e.preventDefault();
        if (state.dirty && !confirm('当前有未保存的修改，确定新建空白文件？')) return;
        newFile();
      }
    });

    window.addEventListener('beforeunload', function (e) {
      if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ---------- 拖拽打开 ---------- */
    let dragDepth = 0;

    window.addEventListener('dragenter', function (e) {
      e.preventDefault();
      dragDepth++;
      dropOverlay.classList.add('show');
    });

    window.addEventListener('dragover', function (e) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('dragleave', function (e) {
      e.preventDefault();
      dragDepth--;
      if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('show'); }
    });

    window.addEventListener('drop', async function (e) {
      e.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove('show');

      if (state.dirty && !confirm('当前有未保存的修改，确定打开新文件？')) return;

      const dt = e.dataTransfer;
      if (!dt) return;

      if (dt.items && dt.items.length) {
        const item = dt.items[0];
        if (item.kind === 'file' && typeof item.getAsFileSystemHandle === 'function') {
          try {
            const handle = await item.getAsFileSystemHandle();
            if (handle && handle.kind === 'file') {
              const file = await handle.getFile();
              await loadFile(file, handle);
              return;
            }
          } catch (err) { console.warn('getAsFileSystemHandle 失败：', err); }
        }
      }

      const file = dt.files && dt.files[0];
      if (file) await loadFile(file, null);
    });

    /* =========================================================
     * 初始化
     * ======================================================= */
    fillEncodingSelect(selDecode, false);
    fillEncodingSelect(selEncode, true);
    selDecode.value = 'utf-8';
    selEncode.value = '__same__';
    selLang.value = 'auto';

    applyTheme();
    updateOptionsUI();
    updateStatus();
    syncGutter();
  })();
</script>
</body>
</html>
