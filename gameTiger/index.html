<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎰 幸运老虎机</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    display:flex;
    padding:16px;
    background:#07040e radial-gradient(ellipse at 50% 0%,#2a1550 0%,#140b28 40%,#07040e 100%);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#fff;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overflow-x:hidden;
  }

  /* ================= 机身 ================= */
  .cabinet{
    width:min(400px,100%);
    margin:auto;
    padding:14px 14px 16px;
    border-radius:26px;
    background:linear-gradient(170deg,#3d2769 0%,#241546 35%,#150c2b 70%,#0d0720 100%);
    border:1px solid rgba(255,200,80,.25);
    box-shadow:
      0 40px 80px -30px #000,
      0 0 110px -40px rgba(255,170,0,.55),
      inset 0 1px 0 rgba(255,255,255,.10);
    position:relative;
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;height:26px;
  }
  .brand{
    font-size:15px;font-weight:900;letter-spacing:3px;
    background:linear-gradient(180deg,#fff7d0,#ffc21a 55%,#ff7a00);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,180,0,.6));
  }
  .reset{
    width:28px;height:28px;border-radius:9px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);
    color:#c9b8f0;font-size:14px;line-height:1;
    cursor:pointer;transition:.18s;
  }
  .reset:hover{background:rgba(255,255,255,.16);color:#fff}

  /* ================= 卷轴窗口 ================= */
  .reel-window{
    position:relative;
    padding:20px;
    border-radius:20px;
    background:linear-gradient(180deg,#0b0718,#150c2b);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.06),
      inset 0 10px 30px rgba(0,0,0,.9);
    margin-bottom:12px;
  }

  /* ---------- 跑马灯 ---------- */
  .light-ring{position:absolute;inset:0;pointer-events:none;z-index:5}
  .bulb{
    position:absolute;
    width:9px;height:9px;border-radius:50%;
    transform:translate(-50%,-50%);
    background:#3d2f1a;
    box-shadow:inset 0 0 4px #000;
    animation:chase 1.5s linear infinite;
  }
  @keyframes chase{
    0%,100%{background:#3d2f1a;box-shadow:inset 0 0 4px #000}
    8%    {background:#ffe98a;box-shadow:0 0 10px 2px #ffb300,0 0 22px #ff8c00}
    16%   {background:#3d2f1a;box-shadow:inset 0 0 4px #000}
  }
  .light-ring.fast .bulb{animation-duration:.5s}
  .light-ring.win .bulb{
    animation:none;
    background:#fff6c0;
    box-shadow:0 0 12px 3px #ffd24a,0 0 28px #ff9d00;
  }

  /* ---------- 卷轴 ---------- */
  .reels{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
    position:relative;z-index:2;
  }
  .reel{
    height:100px;overflow:hidden;border-radius:11px;position:relative;
    background:linear-gradient(180deg,#2a1a52,#402a75 50%,#2a1a52);
    box-shadow:inset 0 0 16px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07);
    transition:box-shadow .2s;
  }
  .reel::after{
    content:'';position:absolute;inset:0;pointer-events:none;border-radius:11px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55));
  }
  .strip{will-change:transform}
  .item{
    height:100px;
    display:flex;align-items:center;justify-content:center;
    font-size:48px;line-height:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));
  }

  /* 中奖高亮 */
  .reel.win{
    animation:reelGlow .7s ease-in-out infinite alternate;
  }
  @keyframes reelGlow{
    from{box-shadow:inset 0 0 16px rgba(0,0,0,.9),0 0 0 2px rgba(255,210,74,.5),0 0 12px rgba(255,200,0,.35)}
    to  {box-shadow:inset 0 0 16px rgba(0,0,0,.9),0 0 0 2px rgba(255,210,74,1),0 0 30px rgba(255,200,0,.95)}
  }

  /* 中奖线 */
  .payline{
    position:absolute;left:20px;right:20px;top:50%;height:2px;
    transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,rgba(255,80,80,.75) 12%,rgba(255,80,80,.75) 88%,transparent);
    box-shadow:0 0 8px rgba(255,60,60,.9);
    z-index:3;pointer-events:none;
  }

  /* ================= 结果文字 ================= */
  .result{
    text-align:center;font-size:15px;font-weight:800;letter-spacing:1px;
    min-height:22px;margin-bottom:10px;color:#9d8fc4;
    transition:color .2s;
  }
  .result.big{
    color:#ffd24a;
    text-shadow:0 0 18px rgba(255,200,0,.9);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1);
  }
  .result.small{color:#6ee7a8}
  .result.lose{color:#8b7bb0}
  @keyframes pop{
    0%{transform:scale(.75);opacity:0}
    60%{transform:scale(1.12)}
    100%{transform:scale(1);opacity:1}
  }

  /* ================= 数据面板 ================= */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    margin-bottom:10px;
  }
  .stat{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:7px 4px;text-align:center;
  }
  .stat span{display:block;font-size:10px;color:#8f82b8;letter-spacing:1px;margin-bottom:2px}
  .stat b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:800}
  .stat.win b{color:#ffd24a}
  .stat.win.hit b{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

  /* ================= 下注 ================= */
  .bet-row{
    display:flex;align-items:center;gap:6px;margin-bottom:10px;
  }
  .icon-btn{
    width:38px;height:40px;flex:0 0 auto;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
    color:#fff;font-size:19px;font-weight:800;
    display:grid;place-items:center;
    cursor:pointer;transition:transform .1s,background .15s;
  }
  .icon-btn:hover:not(:disabled){background:rgba(255,255,255,.2)}
  .icon-btn:active:not(:disabled){transform:scale(.92)}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed}

  .chip{
    flex:1;height:40px;border-radius:12px;
    border:1px solid rgba(255,210,74,.28);
    background:linear-gradient(180deg,rgba(255,210,74,.13),rgba(255,210,74,.03));
    color:#ffd98a;font-weight:800;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .chip:hover:not(:disabled){background:rgba(255,210,74,.22)}
  .chip.active{
    background:linear-gradient(180deg,#ffe98a,#ffb300);
    color:#3a1d00;border-color:transparent;
    box-shadow:0 0 16px rgba(255,180,0,.65);
  }
  .chip:disabled{opacity:.35;cursor:not-allowed}

  /* ================= 旋转按钮 ================= */
  .spin-btn{
    width:100%;padding:15px;border:none;border-radius:16px;
    font-size:17px;font-weight:900;letter-spacing:7px;text-indent:7px;
    color:#3a1d00;cursor:pointer;
    background:linear-gradient(180deg,#ffef9e,#ffbe1a 50%,#ff8a00);
    box-shadow:
      0 6px 0 #a45c00,
      0 16px 30px -12px rgba(255,160,0,.9),
      0 0 44px -12px rgba(255,180,0,.7);
    transition:transform .08s,box-shadow .08s,filter .2s;
    margin-bottom:12px;
  }
  .spin-btn:active:not(:disabled){
    transform:translateY(4px);
    box-shadow:0 2px 0 #a45c00,0 8px 18px -12px rgba(255,160,0,.9);
  }
  .spin-btn:disabled{
    filter:grayscale(.8) brightness(.6);
    cursor:not-allowed;
    box-shadow:0 6px 0 #3d3120;
  }

  /* ================= 开关组 ================= */
  .switch-row{display:flex;gap:8px;margin-bottom:10px}
  .switch{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 4px;border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;font-size:11px;color:#a99cc9;
    transition:.18s;
  }
  .switch:hover{background:rgba(255,255,255,.08)}
  .switch input{display:none}
  .track{
    width:34px;height:18px;border-radius:9px;flex:0 0 auto;
    background:#2a1d4a;position:relative;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.7);
    transition:background .2s;
  }
  .thumb{
    position:absolute;top:2px;left:2px;
    width:14px;height:14px;border-radius:50%;
    background:#6b5b96;
    transition:left .2s,background .2s;
  }
  .switch input:checked + .track{
    background:linear-gradient(90deg,#ffb300,#ff8a00);
    box-shadow:0 0 12px rgba(255,170,0,.65),inset 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .track .thumb{left:18px;background:#fff}
  .switch input:checked ~ .sw-label{color:#ffd24a}

  /* ================= 音量 ================= */
  .volume-row{
    display:flex;align-items:center;gap:9px;
    margin-bottom:12px;font-size:14px;
  }
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;
    height:6px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,#ffb300 var(--p,80%),#2a1d4a var(--p,80%));
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#ffb300);
    box-shadow:0 0 10px rgba(255,180,0,.9);
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border:none;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,#ffb300);
    box-shadow:0 0 10px rgba(255,180,0,.9);
    cursor:pointer;
  }

  /* ================= 赔率表 ================= */
  .paytable{
    display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
  }
  .pay-item{
    background:rgba(255,255,255,.04);
    border-radius:9px;padding:5px 2px;text-align:center;
    font-size:9px;color:#8f82b8;line-height:1.25;
  }
  .pay-item .sym{display:block;font-size:17px;margin-bottom:1px}
  .pay-item .x{color:#ffd24a;font-weight:800;font-size:10px}
</style>
</head>
<body>

<div class="cabinet">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand">🎰 LUCKY 7</div>
    <button class="reset" id="resetBtn" title="重置余额">↺</button>
  </div>

  <!-- 卷轴区 -->
  <div class="reel-window">
    <div class="light-ring" id="lightRing"></div>
    <div class="reels">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
    </div>
    <div class="payline"></div>
  </div>

  <!-- 结果 -->
  <div class="result" id="result">按「旋 转」开始游戏</div>

  <!-- 数据 -->
  <div class="stats">
    <div class="stat"><span>余额</span><b id="balance">1000</b></div>
    <div class="stat"><span>下注</span><b id="bet">10</b></div>
    <div class="stat win" id="winStat"><span>赢得</span><b id="lastWin">0</b></div>
  </div>

  <!-- 下注 -->
  <div class="bet-row">
    <button class="icon-btn" id="minus">−</button>
    <button class="chip active" data-bet="10">10</button>
    <button class="chip" data-bet="50">50</button>
    <button class="chip" data-bet="100">100</button>
    <button class="chip" data-bet="500">500</button>
    <button class="icon-btn" id="plus">＋</button>
  </div>

  <!-- 旋转 -->
  <button class="spin-btn" id="spinBtn">旋 转</button>

  <!-- 开关 -->
  <div class="switch-row">
    <label class="switch">
      <input type="checkbox" id="autoSwitch">
      <span class="track"><span class="thumb"></span></span>
      <span class="sw-label">自动</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="fastSwitch">
      <span class="track"><span class="thumb"></span></span>
      <span class="sw-label">快速</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="soundSwitch" checked>
      <span class="track"><span class="thumb"></span></span>
      <span class="sw-label">音效</span>
    </label>
  </div>

  <!-- 音量 -->
  <div class="volume-row">
    <span>🔈</span>
    <input type="range" id="volume" min="0" max="100" value="80" style="--p:80%">
    <span>🔊</span>
  </div>

  <!-- 赔率 -->
  <div class="paytable" id="paytable"></div>

</div>

<script>
/* =========================================================
   音效引擎（Web Audio，无需外部文件）
   ========================================================= */
const Sound = (() => {
  let ac = null, master = null;
  let muted = false, vol = 0.8;

  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : vol;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function setVol(v) {
    vol = v;
    if (master && !muted) master.gain.value = v;
  }
  function setMuted(m) {
    muted = m;
    if (master) master.gain.value = m ? 0 : vol;
  }

  function tone(freq, dur, o) {
    o = o || {};
    if (!ac || muted) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(o.to, 1), t0 + dur);
    const peak = o.vol != null ? o.vol : 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.atk || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function noise(dur, o) {
    o = o || {};
    if (!ac || muted) return;
    const t0 = ac.currentTime + (o.delay || 0);
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.value = o.freq || 1500;
    f.Q.value = o.q || 1;
    const g = ac.createGain();
    g.gain.setValueAtTime(o.vol != null ? o.vol : 0.25, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }

  return {
    ensure, setVol, setMuted,
    get muted() { return muted; },

    /* 按钮点击 */
    click() {
      tone(880, 0.05, { type: 'square', vol: 0.12 });
      tone(1320, 0.04, { type: 'square', vol: 0.06, delay: 0.01 });
    },
    /* 卷轴滚动滴答 */
    tick() {
      noise(0.035, { vol: 0.18, freq: 2400 + Math.random() * 900, q: 2 });
      tone(700 + Math.random() * 300, 0.025, { type: 'square', vol: 0.05 });
    },
    /* 开始旋转：呼啸声 */
    startSpin() {
      tone(180, 0.55, { type: 'sawtooth', vol: 0.15, to: 1100 });
      tone(360, 0.45, { type: 'square', vol: 0.07, to: 1600, delay: 0.02 });
      noise(0.4, { vol: 0.12, freq: 3000, q: 0.7 });
    },
    /* 单个卷轴停住：闷响，音高递增 */
    reelStop(i) {
      tone(200 - i * 25, 0.16, { type: 'square', vol: 0.32, to: 70 });
      noise(0.13, { vol: 0.32, freq: 380, q: 1.2 });
      tone(1046 + i * 180, 0.12, { type: 'triangle', vol: 0.16, delay: 0.05 });
    },
    /* 中奖 */
    win(level) {
      const seq = {
        2: [523.25, 659.25],
        3: [523.25, 659.25, 783.99, 1046.50],
        4: [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00]
      }[level] || [523.25];

      seq.forEach((f, i) => {
        tone(f, 0.5, { type: 'triangle', vol: 0.30, delay: i * 0.075 });
        tone(f * 2, 0.32, { type: 'sine', vol: 0.13, delay: i * 0.075 });
      });

      /* 大奖加金币音效 */
      if (level >= 3) {
        for (let i = 0; i < 8; i++) {
          noise(0.07, { vol: 0.13, freq: 3200 + Math.random() * 5000, delay: 0.25 + i * 0.11 });
        }
        [261.63, 329.63, 392.00, 523.25].forEach((f, i) => {
          tone(f, 0.85, { type: 'sawtooth', vol: 0.14, delay: 0.5 + i * 0.05 });
        });
      }
    },
    /* 未中奖 */
    lose() {
      tone(320, 0.18, { type: 'sawtooth', vol: 0.14, to: 170 });
      tone(200, 0.3, { type: 'sine', vol: 0.11, to: 95, delay: 0.09 });
    }
  };
})();

/* =========================================================
   配置
   ========================================================= */
const ITEM_H = 100;                 // 单个符号高度，必须与 CSS 中 .reel/.item 高度一致
const COPIES = 4;                   // 卷轴带重复份数
const BET_MIN = 10, BET_MAX = 500, BET_STEP = 10;
const START_BALANCE = 1000;

const SYMBOLS = [
  { c: '🍒', pay: 8,   w: 25, name: '樱桃' },
  { c: '🍋', pay: 14,  w: 22, name: '柠檬' },
  { c: '🍊', pay: 20,  w: 18, name: '橘子' },
  { c: '🍇', pay: 28,  w: 13, name: '葡萄' },
  { c: '🔔', pay: 50,  w: 10, name: '铃铛' },
  { c: '⭐', pay: 85,  w: 6,  name: '星星' },
  { c: '💎', pay: 170, w: 4,  name: '钻石' },
  { c: '7️⃣', pay: 420, w: 2,  name: '幸运7' },
];
const L = SYMBOLS.length;
const PERIOD = L * ITEM_H;

/* =========================================================
   状态
   ========================================================= */
let balance = START_BALANCE;
let bet = 10;
let spinning = false;
let autoRunning = false;
let lastWin = 0;

/* =========================================================
   DOM
   ========================================================= */
const reelEls   = [...document.querySelectorAll('.reel')];
const balanceEl = document.getElementById('balance');
const betEl     = document.getElementById('bet');
const lastWinEl = document.getElementById('lastWin');
const winStatEl = document.getElementById('winStat');
const resultEl  = document.getElementById('result');
const spinBtn   = document.getElementById('spinBtn');
const minusBtn  = document.getElementById('minus');
const plusBtn   = document.getElementById('plus');
const resetBtn  = document.getElementById('resetBtn');
const chipEls   = [...document.querySelectorAll('.chip')];
const ringEl    = document.getElementById('lightRing');
const autoSwitch  = document.getElementById('autoSwitch');
const fastSwitch  = document.getElementById('fastSwitch');
const soundSwitch = document.getElementById('soundSwitch');
const volumeEl    = document.getElementById('volume');
const paytableEl  = document.getElementById('paytable');

/* =========================================================
   初始化跑马灯
   ========================================================= */
(function buildLights() {
  const TOTAL = 28;
  let idx = 0;
  const add = (leftPct, topPct) => {
    const b = document.createElement('i');
    b.className = 'bulb';
    b.style.left = leftPct + '%';
    b.style.top = topPct + '%';
    b.style.animationDelay = ((idx / TOTAL) * 1.5).toFixed(2) + 's';
    ringEl.appendChild(b);
    idx++;
  };
  for (let i = 0; i < 9; i++) add(7 + i * 10.75, 0);      // 上
  for (let i = 0; i < 5; i++) add(100, 22 + i * 14);      // 右
  for (let i = 0; i < 9; i++) add(93 - i * 10.75, 100);   // 下
  for (let i = 0; i < 5; i++) add(0, 78 - i * 14);        // 左
})();

/* =========================================================
   初始化卷轴
   ========================================================= */
const reels = reelEls.map(el => {
  const strip = el.querySelector('.strip');
  for (let k = 0; k < COPIES; k++) {
    SYMBOLS.forEach(s => {
      const d = document.createElement('div');
      d.className = 'item';
      d.textContent = s.c;
      strip.appendChild(d);
    });
  }
  const startIdx = Math.floor(Math.random() * L);
  const pos = startIdx * ITEM_H;
  strip.style.transform = `translate3d(0,${-pos}px,0)`;
  return { el, strip, pos };
});

/* =========================================================
   赔率表渲染
   ========================================================= */
paytableEl.innerHTML = SYMBOLS.map(s =>
  `<div class="pay-item"><span class="sym">${s.c}</span><span class="x">×${s.pay}</span></div>`
).join('');

/* =========================================================
   工具
   ========================================================= */
const TOTAL_W = SYMBOLS.reduce((a, b) => a + b.w, 0);

function pickWeighted() {
  let r = Math.random() * TOTAL_W;
  for (let i = 0; i < L; i++) {
    r -= SYMBOLS[i].w;
    if (r < 0) return i;
  }
  return L - 1;
}

function animateNumber(el, from, to, dur) {
  dur = dur || 420;
  const t0 = performance.now();
  (function step(t) {
    const p = Math.min((t - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function showResult(text, type) {
  resultEl.textContent = text;
  resultEl.className = 'result' + (type ? ' ' + type : '');
}

function clearHighlights() {
  reelEls.forEach(el => el.classList.remove('win'));
  ringEl.classList.remove('win');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* =========================================================
   HUD
   ========================================================= */
function updateHUD(animate) {
  if (animate) {
    const from = parseInt(balanceEl.textContent, 10) || 0;
    animateNumber(balanceEl, from, balance);
  } else {
    balanceEl.textContent = balance;
  }
  betEl.textContent = bet;
  lastWinEl.textContent = lastWin;

  spinBtn.disabled = spinning || balance < bet;
  minusBtn.disabled = spinning || bet <= BET_MIN;
  plusBtn.disabled = spinning || bet >= BET_MAX;

  chipEls.forEach(c => {
    const v = +c.dataset.bet;
    c.classList.toggle('active', v === bet);
    c.disabled = spinning || v > balance;
  });
}

/* =========================================================
   卷轴动画
   ========================================================= */
function animateReel(reel, targetIdx, duration) {
  return new Promise(resolve => {
    const startPos = reel.pos;
    const startTime = performance.now();

    let endPos = targetIdx * ITEM_H;
    while (endPos < startPos + PERIOD * 1.6) endPos += PERIOD;

    const dist = endPos - startPos;

    function frame(now) {
      const t = Math.min((now - startTime) / duration, 1);
      const e = 1 - Math.pow(1 - t, 3);          // easeOutCubic
      reel.pos = startPos + dist * e;
      reel.strip.style.transform = `translate3d(0,${-reel.pos}px,0)`;

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        reel.pos = endPos % PERIOD;
        reel.strip.style.transform = `translate3d(0,${-reel.pos}px,0)`;
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* =========================================================
   滚动滴答音
   ========================================================= */
let tickTimer = null;

function startTicks() {
  stopTicks();
  let d = 45;
  const run = () => {
    Sound.tick();
    d = Math.min(d * 1.05, 115);
    tickTimer = setTimeout(run, d);
  };
  run();
}
function stopTicks() {
  if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
}

/* =========================================================
   结算
   ========================================================= */
function settle(targets) {
  const [a, b, c] = targets;
  let win = 0, level = 0;

  if (a === b && b === c) {
    /* 三连 */
    const sym = SYMBOLS[a];
    win = bet * sym.pay;
    level = sym.pay >= 170 ? 4 : 3;
    reelEls.forEach(el => el.classList.add('win'));
    ringEl.classList.add('win');
    showResult(`${sym.c} ${sym.name} 三连击！+${win}`, 'big');
  } else if (a === b || b === c || a === c) {
    /* 两连 */
    win = bet * 2;
    level = 2;
    const groups = {};
    targets.forEach((v, i) => { (groups[v] = groups[v] || []).push(i); });
    Object.values(groups).forEach(arr => {
      if (arr.length >= 2) arr.forEach(i => reelEls[i].classList.add('win'));
    });
    showResult(`两个相同！+${win}`, 'small');
  } else {
    showResult('差一点点，再来一次！', 'lose');
  }

  if (win > 0) {
    balance += win;
    lastWin = win;
    winStatEl.classList.remove('hit');
    void winStatEl.offsetWidth;      // 触发重播动画
    winStatEl.classList.add('hit');
    Sound.win(level);
  } else {
    lastWin = 0;
    Sound.lose();
  }
}

/* =========================================================
   旋转
   ========================================================= */
async function spin() {
  if (spinning) return;
  Sound.ensure();

  if (balance < bet) {
    showResult('余额不足，点右上角 ↺ 重置', 'lose');
    Sound.lose();
    return;
  }

  spinning = true;
  balance -= bet;
  lastWin = 0;
  updateHUD(true);
  clearHighlights();
  showResult('旋转中…', '');

  spinBtn.textContent = '旋转中';
  ringEl.classList.add('fast');
  Sound.startSpin();
  startTicks();

  const targets = reels.map(() => pickWeighted());
  const fast = fastSwitch.checked;
  const durations = fast ? [600, 800, 1000] : [1150, 1500, 1850];

  await Promise.all(
    reels.map((r, i) =>
      animateReel(r, targets[i], durations[i]).then(() => Sound.reelStop(i))
    )
  );

  stopTicks();
  ringEl.classList.remove('fast');
  spinning = false;
  spinBtn.textContent = '旋 转';

  settle(targets);
  updateHUD(false);
}

/* =========================================================
   自动旋转
   ========================================================= */
async function autoLoop() {
  while (autoRunning) {
    if (spinning) { await sleep(200); continue; }

    if (balance < bet) {
      autoRunning = false;
      autoSwitch.checked = false;
      showResult('余额不足，自动已关闭', 'lose');
      break;
    }

    await spin();
    await sleep(450);
  }
}

/* =========================================================
   事件
   ========================================================= */
spinBtn.addEventListener('click', () => { Sound.ensure(); spin(); });

minusBtn.addEventListener('click', () => {
  if (spinning) return;
  Sound.ensure(); Sound.click();
  bet = Math.max(BET_MIN, bet - BET_STEP);
  updateHUD(false);
});

plusBtn.addEventListener('click', () => {
  if (spinning) return;
  Sound.ensure(); Sound.click();
  bet = Math.min(BET_MAX, bet + BET_STEP);
  updateHUD(false);
});

chipEls.forEach(c => {
  c.addEventListener('click', () => {
    if (spinning || c.disabled) return;
    Sound.ensure(); Sound.click();
    bet = Math.min(BET_MAX, Math.max(BET_MIN, +c.dataset.bet));
    updateHUD(false);
  });
});

resetBtn.addEventListener('click', () => {
  if (spinning) return;
  Sound.ensure(); Sound.click();
  autoRunning = false;
  autoSwitch.checked = false;
  balance = START_BALANCE;
  bet = 10;
  lastWin = 0;
  clearHighlights();
  showResult('已重置，祝你好运！', '');
  updateHUD(false);
});

/* 自动开关 */
autoSwitch.addEventListener('change', () => {
  Sound.ensure(); Sound.click();
  if (autoSwitch.checked) {
    if (spinning) { autoSwitch.checked = false; return; }
    autoRunning = true;
    autoLoop();
  } else {
    autoRunning = false;
  }
});

/* 快速开关 */
fastSwitch.addEventListener('change', () => {
  Sound.ensure(); Sound.click();
});

/* 音效开关 */
soundSwitch.addEventListener('change', () => {
  Sound.ensure();
  Sound.setMuted(!soundSwitch.checked);
  if (soundSwitch.checked) Sound.click();
});

/* 音量 */
volumeEl.addEventListener('input', e => {
  const v = +e.target.value;
  e.target.style.setProperty('--p', v + '%');
  Sound.ensure();
  Sound.setVol(v / 100);
  if (!Sound.muted && v > 0) Sound.click();
});

/* 空格键旋转 */
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    spinBtn.click();
  }
});

/* 首次交互解锁音频 */
document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });

/* 启动 */
updateHUD(false);
</script>
</body>
</html>
